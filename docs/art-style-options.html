<header><h1>《铸剑录》细节像素风选项板</h1><p>所有画面均为同一铁匠铺的程序化概念草图，用于比较方向，不是最终素材。</p></header>

function R(ctx,x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function L(ctx,x1,y1,x2,y2,c,w=1){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(Math.round(x1),Math.round(y1));ctx.lineTo(Math.round(x2),Math.round(y2));ctx.stroke()}
function P(ctx,pts,c){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();ctx.fill()}
function seeded(seed){return()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}}
function glow(ctx,x,y,r,c,a=.28){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c);g.addColorStop(1,'transparent');ctx.globalAlpha=a;ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);ctx.globalAlpha=1}
function sword(ctx,x,y,s=1,kind='plain',color='#c8c4b9',rot=0){ctx.save();ctx.translate(x,y);ctx.rotate(rot);const fantasy=kind==='fantasy'||kind==='high';const len=(fantasy?58:48)*s;ctx.fillStyle='#17110e';ctx.fillRect(-5*s,-len/2-3*s,10*s,len+12*s);ctx.fillStyle=color;P(ctx,[[-2*s,-len/2],[2*s,-len/2],[4*s,len/2-8*s],[0,len/2-3*s],[-4*s,len/2-8*s]],color);R(ctx,-10*s,len/2-8*s,20*s,4*s,fantasy?'#d5a84a':'#a77a39');R(ctx,-3*s,len/2-4*s,6*s,12*s,'#6e422c');if(fantasy){R(ctx,-7*s,-4*s,3*s,17*s,'#8b65cd');R(ctx,4*s,-11*s,3*s,19*s,'#e0bd62')}ctx.restore()}

 P(ctx,[[31,146],[37,128],[43,146]],p.fire);P(ctx,[[39,146],[47,121],[54,146]],p.light);P(ctx,[[50,146],[55,132],[61,146]],p.fire);R(ctx,13,156,61,8,p.shadow);R(ctx,17,156,53,5,p.stone);
 // workbench/anvil
 if(three){R(ctx,102,126,111,10,p.shadow);P(ctx,[[104,122],[202,122],[213,129],[113,129]],p.wood2);R(ctx,111,132,9,37,p.wood);R(ctx,194,132,9,37,p.wood);R(ctx,116,151,83,5,p.wood2)}
 P(ctx,[[112,115],[170,115],[179,121],[105,121]],p.metal);P(ctx,[[128,121],[158,121],[155,150],[166,162],[118,162],[130,150]],p.stone);L(ctx,115,116,169,116,'#f0eee5',2);
 // hammer
 R(ctx,152,59,24,9,p.shadow);R(ctx,153,60,22,7,p.metal);ctx.save();ctx.translate(170,66);ctx.rotate(-.12);R(ctx,0,0,5,42,p.shadow);R(ctx,1,1,3,40,p.wood2);ctx.restore();

 drawDetail(ctx,p,cfg,rand);drawPeople(ctx,p,cfg);if(cfg.mood==='dark'||cfg.mood==='ritual'){P(ctx,[[120,8],[200,8],[215,32],[105,32]],p.shadow);for(let i=0;i<5;i++)R(ctx,133+i*14,18,3,9,p.magic)}
 if(cfg.fx==='strict'){/* intentionally no smooth layer */}else if(cfg.fx==='hd'){ctx.globalAlpha=.16;ctx.fillStyle='#ffd58a';ctx.beginPath();ctx.moveTo(0,70);ctx.lineTo(180,160);ctx.lineTo(80,180);ctx.closePath();ctx.fill();ctx.globalAlpha=1}else if(cfg.fx==='vector'){const g=ctx.createLinearGradient(100,90,190,150);g.addColorStop(0,'#dad7ce');g.addColorStop(1,'#4c4e50');ctx.fillStyle=g;ctx.fillRect(122,119,40,31)}
}
function drawDetail(ctx,p,cfg,rand){const n=cfg.detail||0;if(n===0)return;for(let i=0;i<n*5;i++){const x=75+rand()*145,y=24+rand()*78;R(ctx,x,y,2+rand()*7,1,rand()>.5?p.wall2:p.shadow)}for(let i=0;i<n*3;i++){const x=8+rand()*210,y=164+rand()*13;R(ctx,x,y,3+rand()*7,2,rand()>.5?p.wood2:p.shadow)}if(n>=2){R(ctx,83,35,3,32,p.metal);R(ctx,88,37,7,3,p.metal);R(ctx,207,47,14,10,p.wood2);R(ctx,210,50,8,1,p.light);R(ctx,71,133,7,5,'#171311');R(ctx,79,137,5,4,'#171311')}if(n>=3){R(ctx,92,94,18,12,'#d0b98b');L(ctx,94,98,106,98,'#765b3b',1);R(ctx,215,134,6,8,p.wood2);R(ctx,214,132,8,2,p.metal);R(ctx,24,164,8,5,'#111');R(ctx,34,165,6,4,'#111')}if(n>=5){for(let i=0;i<12;i++)R(ctx,65+rand()*155,113+rand()*58,2+rand()*5,1+rand()*3,rand()>.5?p.wood:p.stone);L(ctx,307,24,279,67,'#d8d1c0',1);L(ctx,307,24,312,52,'#d8d1c0',1)}if(p===palettes.ruin){R(ctx,85,10,30,18,p.shadow);R(ctx,93,18,22,17,p.sky);for(let i=0;i<10;i++)R(ctx,18+rand()*290,106+rand()*68,2+rand()*8,2+rand()*4,p.stone)}}

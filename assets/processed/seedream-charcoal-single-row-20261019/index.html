<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>铸剑录 · 正交砖房素材</title><style>body{margin:0;padding:24px;background:#181518;color:#e7d8bd;font:15px system-ui,sans-serif}main{max-width:1440px;margin:auto}h1{font-size:24px}p{color:#b9a991}img{width:100%;display:block;image-rendering:pixelated}.scene{position:relative;width:100%;aspect-ratio:1920/1080;background:#211d24}.scene img{position:absolute;inset:0;height:100%}fieldset{display:flex;flex-wrap:wrap;gap:18px;margin:20px 0;border:1px solid #564739}input{margin-right:7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}figure{margin:0;padding:14px;background:#28232a}figcaption{padding-top:10px}.links{display:flex;gap:20px}a{color:#e2bd79}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style><main><h1>正面正交砖房 · 图层示例</h1><p>无木质建筑结构 · 烟道接天花板 · 砖墙挂剑 · 统一炉火主光。各层按官方 absolute 边界还原到同尺寸画布。</p><div class="links"><a href="original.png">生成原图</a><a href="reconstructed.png">图层重组原尺寸</a><a href="layers-contact-sheet.png">图层对照</a><a href="layers.json">坐标与尺寸</a></div><fieldset id="switches"><legend>图层开关</legend></fieldset><div class="scene" id="scene"></div><h2>生成原图</h2><img src="original.png" alt="正交砖房生成原图"><h2>独立全画布图层</h2><div id="gallery" class="grid"></div></main><script type="module">const report=await(await fetch('layers.json')).json();for(const layer of report.layers){const image=document.createElement('img');image.src=layer.file;image.alt=layer.name;image.dataset.z=layer.z_index;document.querySelector('#scene').append(image);const label=document.createElement('label');const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.checked=true;checkbox.addEventListener('change',()=>image.hidden=!checkbox.checked);label.append(checkbox,document.createTextNode(layer.name));document.querySelector('#switches').append(label);const figure=document.createElement('figure');const thumb=document.createElement('img');thumb.src=layer.file;thumb.alt=layer.name;const caption=document.createElement('figcaption');caption.textContent=layer.name;figure.append(thumb,caption);document.querySelector('#gallery').append(figure);}</script></html>
